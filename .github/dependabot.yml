version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
    groups:
      npm-root:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/public"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
    groups:
      npm-public:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"

name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  # Only Dependabot's own webhook events; not human or agent pushes to a Dependabot branch.
  enable-auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      # Per-repo fine-grained PAT (Contents, Pull requests, Workflows RW) stored as a Dependabot secret; the merge push can trigger deploys.
      GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
    steps:
      # GitHub auto-merge waits for required status checks on main only after those checks are configured.
      - name: Enable auto-merge for Dependabot PR
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::DEPENDABOT_AUTOMERGE_TOKEN Dependabot secret is not set"; exit 1; fi
          gh pr merge --auto --squash "$PR_URL"
